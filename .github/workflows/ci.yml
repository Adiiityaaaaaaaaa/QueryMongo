name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # WinUI 3 and the DPAPI-backed connection store are Windows-only.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore QueryMongo.slnx

      - name: Build
        run: dotnet build QueryMongo.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/QueryMongo.Core.Tests/QueryMongo.Core.Tests.csproj -c Release --no-build

      - name: Publish self-contained exe
        run: dotnet publish src/QueryMongo.App -c Release -r win-x64 -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: QueryMongo-win-x64
          path: dist/
          retention-days: 14
